services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wandr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env                  # loads SECRET_KEY, ALGORITHM, token expiry etc.
    environment:
      # overrides DATABASE_URL from .env — inside Docker, db service is the hostname
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wandr
    depends_on:
      db:
        condition: service_healthy   # waits until postgres is actually ready

volumes:
  postgres_data:
